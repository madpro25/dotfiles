source = $HOME/.cache/wal/colors-waybar.css

background {
    monitor =
    path = $HOME/Downloads/Backgrounds/Undertow (Final).png  # only png supported for now
    color = $color7

    # all these options are taken from hyprland, see https://wiki.hyprland.org/Configuring/Variables/#blur for explanations
    blur_size = 4
    blur_passes = 0 # 0 disables blurring
    noise = 0.0117
    contrast = 1.3000 # Vibrant!!!
    brightness = 0.8000
    vibrancy = 0.2100
    vibrancy_darkness = 0.0
}

input-field {
    monitor =
    size = 250, 50
    outline_thickness = 3
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.64 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = $color1
    inner_color = $color0
    font_color = $color7
    fade_on_empty = true
    placeholder_text = <span color="grey" font_style="italic">$USER's password</span>
    hide_input = false
    position = 0, 50
    halign = center
    valign = bottom
}

label {
    # <16ms per frame = >60fps
    text = cmd[update:16] echo
}

label {
    monitor =
    text = cmd[update:1000] echo "<b><big> $(date +'%A %B %d') </big></b>"
    color = $color0
    font_size = 30
    font_family = JetBrains Mono Nerd Font 10
    position = 0, 132
    halign = center
    valign = center
}

# Current time
label {
    monitor =
    text = cmd[update:1000] echo "<b><big> $(date +"%H:%M:%S") </big></b>"
    color = $color0
    font_size = 64
    font_family = JetBrains Mono Nerd Font 10
    position = 0, 16
    halign = center
    valign = center
}

# User label
label {
    monitor =
    text = Hey <span text_transform="capitalize" size="larger">$USER</span>
    color = $color0
    font_size = 20
    font_family = JetBrains Mono Nerd Font 10
    position = 0, -100
    halign = center
    valign = center
}

# Type to unlock
label {
    monitor =
    text = Type to unlock!
    color = $color0
    font_size = 16
    font_family = JetBrains Mono Nerd Font 10
    position = 0, 10
    halign = center
    valign = bottom
}
